<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NowLabs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;background:#000;color:#e0e0e0;font-family:"DM Mono","Courier New",monospace;-webkit-font-smoothing:antialiased;overflow:hidden;}
    a{color:inherit;text-decoration:none;cursor:pointer;}
    button{cursor:pointer;background:none;border:none;font:inherit;color:inherit;}

    /* TOP BAR */
    .top-bar{position:fixed;top:0;right:0;z-index:10;display:flex;gap:.5rem;padding:1.25rem 1.5rem;}
    .tb{font-size:.6875rem;letter-spacing:.1em;text-transform:uppercase;color:#999;padding:.4375rem 1rem;border:1px solid rgba(255,255,255,.1);border-radius:3px;background:rgba(12,12,12,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:color .2s,border-color .2s,background .2s;}
    .tb:hover{color:#000;background:#e8d44d;border-color:#e8d44d;}

    /* STAGE */
    .stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3rem;gap:1.5rem;}
    .stage-title{font-size:clamp(1.5rem,4vw,3rem);font-weight:300;letter-spacing:-.02em;color:#fff;text-align:center;}
    .stage-content{position:relative;max-width:900px;max-height:65vh;display:flex;align-items:center;justify-content:center;}
    .stage-content img{max-width:100%;max-height:65vh;object-fit:contain;border-radius:2px;display:block;}
    .stage-placeholder{width:500px;aspect-ratio:1/1;background:#0a0a0a;border-radius:3px;display:flex;align-items:center;justify-content:center;color:#222;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;}
    .stage-launch{position:absolute;bottom:1.25rem;left:50%;transform:translateX(-50%);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:#fff;padding:.375rem .875rem;border:1px solid rgba(255,255,255,.12);border-radius:3px;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);transition:color .2s,border-color .2s,background .2s;}
    .stage-launch:hover{color:#000;background:#e8d44d;border-color:#e8d44d;}

    /* METADATA BLOCK — architectural title block */
    .meta-block{position:fixed;bottom:1.5rem;right:1.5rem;z-index:10;border:1px solid rgba(255,255,255,.1);min-width:240px;background:rgba(0,0,0,.4);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
    .meta-header{padding:.5rem .875rem;border-bottom:1px solid rgba(255,255,255,.1);font-size:.85rem;letter-spacing:.14em;text-transform:uppercase;color:#fff;}
    .meta-row{display:flex;justify-content:space-between;gap:2rem;padding:.375rem .875rem;border-bottom:1px solid rgba(255,255,255,.06);}
    .meta-row:last-child{border-bottom:none;}
    .meta-key{font-size:.85rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.5);}
    .meta-val{font-size:.85rem;letter-spacing:.04em;text-transform:uppercase;color:#fff;text-align:right;}

    /* BOTTOM LEFT — title */
    .bottom-id{position:fixed;bottom:1.5rem;left:1.5rem;z-index:10;}
    .bottom-id span{display:block;font-size:.6875rem;letter-spacing:.06em;color:#333;}

    @media(max-width:640px){
      .meta-block{left:1rem;right:1rem;bottom:1rem;min-width:auto;}
      .bottom-id{display:none;}
      .stage{padding:1.5rem;gap:1rem;}
      .stage-title{font-size:1.25rem;}
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <a href="#" class="tb" id="dlBtn">Download</a>
    <a href="/#index" class="tb">Close</a>
  </div>

  <div class="stage">
    <h1 class="stage-title" id="stageTitle"></h1>
    <div class="stage-content" id="stageContent">
      <div class="stage-placeholder">Loading</div>
    </div>
  </div>

  <div class="bottom-id" id="bottomId"></div>
  <div class="meta-block" id="metaBlock"></div>

  <script>
    const slug=location.pathname.replace(/^\/projects\//,"").replace(/\/$/,"");
    fetch("/projects.json").then(r=>r.json()).then(data=>{
      const p=data.find(x=>x.slug===slug);
      if(!p)return;
      document.title=p.title+" — NowLabs";

      // Title
      document.getElementById("stageTitle").textContent=p.title;

      // Stage content
      const sc=document.getElementById("stageContent");
      let html="";
      if(p.thumbnail){
        html=`<img src="${p.thumbnail}" alt="${p.title}">`;
      }else{
        html=`<div class="stage-placeholder">${p.title}</div>`;
      }
      // Check for app.html (real prototype)
      fetch("app.html",{method:"HEAD"}).then(r=>{
        if(r.ok) html+=`<a href="app.html" target="_blank" rel="noopener" class="stage-launch">Launch Prototype</a>`;
        sc.innerHTML=html;
      }).catch(()=>{sc.innerHTML=html;});

      // Bottom left
      document.getElementById("bottomId").innerHTML=
        `<span>${p.title}</span><span style="color:#222;margin-top:.125rem;">Tags / [${p.category}]</span>`;

      // Metadata block
      document.getElementById("metaBlock").innerHTML=`
        <div class="meta-header">${p.id}</div>
        <div class="meta-row"><span class="meta-key">Project</span><span class="meta-val">${p.title}</span></div>
        <div class="meta-row"><span class="meta-key">Date</span><span class="meta-val">${p.date}</span></div>
        <div class="meta-row"><span class="meta-key">Category</span><span class="meta-val">${p.category}</span></div>
        <div class="meta-row"><span class="meta-key">Stack</span><span class="meta-val">${p.stack}</span></div>`;
    }).catch(e=>console.error(e));
  </script>
</body>
</html>
