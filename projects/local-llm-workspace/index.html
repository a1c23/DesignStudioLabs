<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local LLM Workspace — Design Studio Labs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;background:#000;color:#e0e0e0;font-family:"DM Mono","Courier New",monospace;-webkit-font-smoothing:antialiased;overflow:hidden;}
    button,a{cursor:pointer;font:inherit;color:inherit;text-decoration:none;}
    button{background:none;border:none;}

    .top-bar{position:fixed;top:0;right:0;z-index:10;display:flex;gap:.5rem;padding:1rem 1.5rem;}
    .tb{font-size:.6875rem;letter-spacing:.1em;text-transform:uppercase;color:#666;padding:.4375rem 1rem;border:1px solid rgba(255,255,255,.1);border-radius:3px;background:rgba(18,18,18,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:color .2s,border-color .2s;}
    .tb:hover{color:#fff;border-color:rgba(255,255,255,.25);}

    .stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:4rem 2rem;}
    .stage-content{width:100%;max-width:900px;aspect-ratio:1/1;background:#0a0a0a;border-radius:3px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
    .stage-placeholder{text-align:center;color:#333;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;line-height:2;}

    .bottom-bar{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-end;padding:1.5rem;z-index:10;}
    .meta{display:flex;flex-direction:column;gap:.25rem;}
    .meta-title{font-size:.75rem;letter-spacing:.06em;color:#888;}
    .meta-tags{font-size:.6875rem;letter-spacing:.08em;text-transform:uppercase;color:#444;}
    .meta-hint{font-size:.625rem;letter-spacing:.1em;text-transform:uppercase;color:#333;}
  </style>
</head>
<body>
  <div class="top-bar">
    <a href="#" class="tb" id="dlBtn">Download</a>
    <a href="/#index" class="tb">Return</a>
  </div>

  <div class="stage">
    <div class="stage-content">
      <p class="stage-placeholder">Local LLM Workspace<br>Prototype content goes here</p>
    </div>
  </div>

  <div class="bottom-bar">
    <div class="meta">
      <span class="meta-title">Local LLM Workspace / 2025-08</span>
      <span class="meta-tags">Tags / [Tools]</span>
    </div>
    <span class="meta-hint">DSL-004</span>
  </div>
</body>
</html>
